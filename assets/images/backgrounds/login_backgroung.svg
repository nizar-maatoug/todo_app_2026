<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1920">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12"
        flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="140" cy="220" r="120" fill="white" fill-opacity="0.08"/>
  <circle cx="920" cy="380" r="180" fill="white" fill-opacity="0.06"/>
  <circle cx="880" cy="1620" r="150" fill="white" fill-opacity="0.08"/>

  <!-- Main task card -->
  <g filter="url(#shadow)">
    <rect x="170" y="520" width="740" height="840"
      rx="40" fill="white" fill-opacity="0.95"/>
  </g>

  <!-- Task rows -->
  <rect x="260" y="700" width="450" height="24" rx="12" fill="#D1D5DB"/>
  <rect x="260" y="830" width="360" height="24" rx="12" fill="#D1D5DB"/>
  <rect x="260" y="960" width="500" height="24" rx="12" fill="#D1D5DB"/>
  <rect x="260" y="1090" width="420" height="24" rx="12" fill="#D1D5DB"/>

  <!-- Checkmarks -->
  <circle cx="220" cy="712" r="30" fill="#22C55E"/>
  <path d="M208 712L218 722L236 702"
        stroke="white"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="220" cy="842" r="30" fill="#22C55E"/>
  <path d="M208 842L218 852L236 832"
        stroke="white"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="220" cy="972" r="30" fill="#22C55E"/>
  <path d="M208 972L218 982L236 962"
        stroke="white"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Floating task card -->
  <g transform="rotate(-8 820 620)">
    <rect x="720" y="560" width="220" height="140"
      rx="24"
      fill="white"
      fill-opacity="0.92"/>
    <rect x="760" y="610" width="120" height="16"
      rx="8"
      fill="#CBD5E1"/>
  </g>

  <!-- Bottom floating card -->
  <g transform="rotate(8 240 1450)">
    <rect x="120" y="1380" width="260" height="160"
      rx="24"
      fill="white"
      fill-opacity="0.9"/>
    <circle cx="190" cy="1455" r="18" fill="#22C55E"/>
    <rect x="225" y="1445" width="100" height="18"
      rx="9"
      fill="#CBD5E1"/>
  </g>

</svg>